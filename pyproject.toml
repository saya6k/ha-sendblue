[project]
name = "hacs-sendblue"
version = "0.1.0"
description = "Sendblue iMessage notifications and Assist for Home Assistant"
requires-python = ">=3.14.2"
license = "MIT"

[dependency-groups]
dev = [
    "pytest-homeassistant-custom-component>=0.13.375",
    "pytest-cov",
    # Required by HA's conversation component, loaded as our dependency.
    "gazetteer-matcher==1.1.0",
    "hassil==3.12.1",
    "home-assistant-intents==2026.10.6",
    # Imported when resolving the preferred Assist pipeline.
    "ha-ffmpeg==3.2.2",
    "mutagen==1.48.1",
    "pymicro-vad==1.0.1",
    "pyspeex-noise==1.0.2",
    "ruff",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py314"
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["custom_components"]
