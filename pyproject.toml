[project]
name = "hacs-sendblue"
version = "0.1.0"
description = "Sendblue iMessage notifications and Assist for Home Assistant"
requires-python = ">=3.14.2"
license = "MIT"

[dependency-groups]
dev = [
    "pytest-homeassistant-custom-component>=0.13.375",
    "pytest-cov",
    "ruff",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py314"
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["custom_components"]
